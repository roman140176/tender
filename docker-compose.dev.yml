services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tender
    ports:
      - "54320:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
volumes:
  pg_data: {}
